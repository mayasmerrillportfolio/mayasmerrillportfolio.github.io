<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Off the Clock Media — Maya Merrill</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#111;--white:#fff;--gray:#f4f3f0;--mid:#888;--line:rgba(0,0,0,0.1);
  --serif:'Playfair Display',serif;--sans:'Inter',sans-serif;
}
body{font-family:var(--sans);background:var(--white);color:var(--black);overflow-x:hidden;padding-left:4rem;padding-right:4rem}

/* ── NAV ── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:1.2rem 2.5rem;background:var(--white);
  border-bottom:1px solid var(--line);
}
.nav-back{font-size:12px;font-weight:500;color:var(--mid);text-decoration:none;letter-spacing:0.07em;text-transform:uppercase;transition:color 0.2s;display:flex;align-items:center;gap:0.5rem}
.nav-back:hover{color:var(--black)}
.nav-name{font-family:var(--serif);font-size:1.1rem;font-weight:700;color:var(--black);text-decoration:none}

/* ── FOOTER ── */
footer{padding:2rem 2.5rem;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;margin-top:4rem}
footer p{font-size:12px;color:var(--mid)}

/* ── RESPONSIVE ── */
@media(max-width:750px){
  nav{padding:1rem 1.25rem}
  footer{flex-direction:column;gap:0.5rem;text-align:center;padding:1.5rem 1.25rem}
  body{padding-left:1.5rem !important;padding-right:1.5rem !important}
  header{padding:5rem 0 1.5rem !important}
  .reel-wrap{max-width:100% !important}
}
</style>
</head>
<body>

<nav>
  <a class="nav-back" href="portfolio.html#photo">← Back</a>
  <a class="nav-name" href="portfolio.html">Maya Merrill</a>
</nav>

<header style="padding:8rem 0 4rem;max-width:100%">
  <p style="font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--mid);margin-bottom:1rem">Storytelling</p>
  <h1 style="font-family:var(--serif);font-size:clamp(2rem,5vw,4rem);font-weight:400;line-height:1.05;letter-spacing:-0.03em;margin-bottom:0.5rem">Off the Clock<br><em style="font-style:italic;color:var(--mid)">Media</em></h1>
  <p style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--mid);margin-bottom:1.5rem">Portland, Oregon</p>
  <p style="font-size:14px;font-weight:300;line-height:1.85;color:#555;max-width:800px;margin-bottom:3rem">Matcha 5K recap video filmed and edited in collaboration with the Off the Clock team, for their social media.</p>

  <div class="reel-wrap" style="max-width:540px">
    <iframe src="https://www.instagram.com/reel/DZ29k1hven7/embed/" frameborder="0" scrolling="no" allowtransparency="true" style="width:100%;min-height:700px;display:block;border:none"></iframe>
  </div>
</header>

<footer>
  <p>© 2026 Maya Merrill</p>
  <p><a href="portfolio.html#photo" style="color:var(--mid);text-decoration:none;font-size:12px;letter-spacing:0.08em;text-transform:uppercase">Back to portfolio →</a></p>
</footer>

</body>
</html>
